# XcodeGen：Xcode Cloud（ci_scripts/ci_post_clone.sh）或自己的 Mac 上執行 `xcodegen generate` 產生 WanderLine.xcodeproj（不進 git）
# IDevice.xcframework 也是在打包時才從 jkcoxson/idevice 的 release 下載（不進 git）
# WanderLineTunnel：App 內建的本機 VPN（Network Extension），兩個 bundle ID 都已在開發者帳號開好 Network Extensions
name: WanderLine
options:
  bundleIdPrefix: wang.chunchieh
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: zh-Hant
settings:
  base:
    DEVELOPMENT_TEAM: 6UFKL7S325
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WanderLine:
    type: application
    platform: iOS
    sources:
      - path: WanderLine
    entitlements:
      path: WanderLine/WanderLine.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - target: WanderLineTunnel
      - framework: Frameworks/IDevice.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd
    info:
      path: WanderLine/Info.plist
      properties:
        CFBundleDisplayName: WanderLine
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: 用來在背景保持執行，讓改好的位置不會中斷。
        NSLocationAlwaysAndWhenInUseUsageDescription: 切到其他 App 時，WanderLine 要在背景繼續送位置，所以需要「永遠」使用位置。
        NSLocalNetworkUsageDescription: WanderLine 要在區域網路上讓「設定」找到它來配對，並連到這支手機自己的開發者服務來改位置。
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-pairable-host._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.chunchieh.wanderline
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  WanderLineTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    dependencies:
      - sdk: NetworkExtension.framework
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: WanderLine VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.chunchieh.wanderline.tunnel
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

# 共用的 scheme（Xcode Cloud 只認得共用 scheme）
schemes:
  WanderLine:
    build:
      targets:
        WanderLine: all
    run:
      config: Debug
    archive:
      config: Release
